<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:720px;background:transparent;overflow:hidden;font-family:'Inter','FreeSans','Noto Sans Bengali',sans-serif}
#cap{position:absolute;left:0;right:0;bottom:46px;display:flex;justify-content:center}
#capbox{background:rgba(8,14,28,.72);border-radius:16px;padding:12px 26px;font-size:40px;font-weight:800;color:#fff;letter-spacing:.2px;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.w{display:inline-block;margin:0 9px;color:rgba(255,255,255,.55);transition:none}
.w.on{color:#fff}.w.cur{color:#ffd84a}
#card{position:absolute;left:820px;top:60px;width:384px;color:#fff;background:linear-gradient(160deg,#10224a,#0a1630);border:1px solid #2a4a8a;border-radius:22px;padding:24px 28px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
#card .bar{height:5px;width:64px;border-radius:3px;background:#3f6bff;margin-bottom:14px}
#card .t{font-size:34px;font-weight:800;line-height:1.15}
#card .s{font-size:21px;color:#9fb4dc;margin-top:8px}
#card .bn{font-size:34px;color:#ffd84a;margin-top:12px;font-weight:700}
#card .big{font-size:96px;font-weight:900;color:#ffd84a;line-height:1}
#card ul{list-style:none;margin:14px 0 0;padding:0}
#card li{font-size:26px;font-weight:700;padding:7px 0;display:flex;align-items:center;gap:12px}
#card li:before{content:"";width:12px;height:12px;border-radius:50%;background:#22c55e;flex:none}
#card.cta{background:linear-gradient(160deg,#1c46c8,#10224a);border-color:#6f94ff}
</style></head><body>
<div id="card" style="display:none"></div>
<div id="cap" style="display:none"><div id="capbox"></div></div>
<script>
let S=null;
const ease=x=>1-Math.pow(1-x,3);
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function draw(t){
  const card=document.getElementById('card'), cap=document.getElementById('cap');
  const c=S.cards.find(c=>t>=c.start&&t<=c.end);
  if(c){
    const a=Math.min(1,(t-c.start)/0.35), b=Math.min(1,(c.end-t)/0.3), k=Math.min(ease(a),ease(Math.max(b,0)));
    card.style.display='block'; card.style.opacity=k; card.style.transform=`translateX(${(1-ease(a))*60}px) scale(${.96+.04*k})`;
    card.className=c.kind==='cta'?'cta':'';
    let h='<div class="bar"></div>';
    if(c.big) h+=`<div class="big" style="${c.big.length>2?'font-size:56px':''}">${esc(c.big)}</div>`;
    h+=`<div class="t">${esc(c.title)}</div>`;
    if(c.sub) h+=`<div class="s">${esc(c.sub)}</div>`;
    if(c.bn) h+=`<div class="bn">${c.bn}</div>`;
    if(c.items.length){h+='<ul>'+c.items.map(([x,ts])=>{const v=t>=ts-0.05;const q=Math.min(1,Math.max(0,(t-ts+0.05)/0.25));if(!v)return '';return `<li style="opacity:${ease(q)};transform:translateX(${(1-(v?ease(q):0))*24}px)">${esc(x)}</li>`}).join('')+'</ul>'}
    card.innerHTML=h;
  } else card.style.display='none';
  const ch=S.caps.find(c=>t>=c.start&&t<=c.end);
  if(ch){
    cap.style.display='flex';
    document.getElementById('capbox').innerHTML=ch.words.map(w=>`<span class="w ${t>=w.s?'on':''} ${t>=w.s&&t<w.e+0.04?'cur':''}">${esc(w.w)}</span>`).join('');
  } else cap.style.display='none';
}
window.setScene=s=>{S=s};window.draw=draw;
</script></body></html>
