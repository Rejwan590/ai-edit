name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  guard:
    name: No fakes, no secrets, skills valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/no-fakes-check.mjs
      - run: node scripts/validate-skills.mjs
  typecheck:
    name: Type-check workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: "**/package.json"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
# Tests that need real media, real tools or a real agent are tagged @real and run on your machine only
# (docs/REAL-TESTING.md). CI runs only checks that need none of that.
